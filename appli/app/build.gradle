plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

afterEvaluate {
    if (project.hasProperty("android.injected.signing.store.file")) {
        println "key store path: ${project.property("android.injected.signing.store.file")}"
    }
    if (project.hasProperty("android.injected.signing.store.password")) {
        println "key store password: ${project.property("android.injected.signing.store.password")}"
    }
    if (project.hasProperty("android.injected.signing.key.alias")) {
        println "key alias: ${project.property("android.injected.signing.key.alias")}"
    }
    if (project.hasProperty("android.injected.signing.key.password")) {
        println "key password: ${project.property("android.injected.signing.key.password")}"
    }
}

// Secrets locaux (non versionnés) lus depuis local.properties, avec repli sur les
// variables d'environnement (utile en CI). Ne jamais committer les valeurs réelles.
def secretProps = new Properties()
def secretPropsFile = rootProject.file("local.properties")
if (secretPropsFile.exists()) {
    secretPropsFile.withInputStream { secretProps.load(it) }
}
def jfrogUser = secretProps.getProperty("JFROG_USER") ?: System.getenv("JFROG_USER") ?: ""
def jfrogPassword = secretProps.getProperty("JFROG_PASSWORD") ?: System.getenv("JFROG_PASSWORD") ?: ""

// Configuration runtime (exposee a l'app via BuildConfig). Les valeurs viennent de
// local.properties / variables d'environnement, jamais codees en dur dans le source.
def readSecret = { String key -> secretProps.getProperty(key) ?: System.getenv(key) ?: "" }

// Environnement PayPal (LIVE / SANDBOX). Defaut LIVE si absent de local.properties :
// la bascule sandbox se fait uniquement en local, jamais en dur dans le code versionne.
def paypalEnvironment = secretProps.getProperty("PAYPAL_ENVIRONMENT") ?: System.getenv("PAYPAL_ENVIRONMENT") ?: "LIVE"

android {
    namespace 'com.audreyRetournayDiet.femSante'
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.audreyretournaydiet.femsanteapp"
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Secrets/config exposes au code via BuildConfig (sources : local.properties / env).
        buildConfigField "String", "API_URL", "\"${readSecret('API_URL')}\""
        buildConfigField "String", "PAYPAL_CLIENT_ID", "\"${readSecret('PAYPAL_CLIENT_ID')}\""
        buildConfigField "String", "RETURN_URL_CARD", "\"${readSecret('RETURN_URL_CARD')}\""
        buildConfigField "String", "RETURN_URL_PAYPAL", "\"${readSecret('RETURN_URL_PAYPAL')}\""
        buildConfigField "String", "PAYPAL_ENVIRONMENT", "\"${paypalEnvironment}\""
    }
    sourceSets {
        main {
            // Ressources réparties par fonctionnalité : chaque sous-dossier de res/ est une
            // racine de ressources distincte (dont "common/" pour les ressources partagées).
            // Aucune racine ne doit en contenir une autre : l'imbrication (res/ + res/xxx)
            // est dépréciée et devient une erreur à partir de Gradle 9.
            def resRoot = new File(projectDir, "src/main/res")
            res.srcDirs = resRoot.listFiles().findAll { it.isDirectory() }.collect {
                "src/main/res/${it.name}"
            }
        }
    }
    buildTypes {
        release {
            ndk {
                debugSymbolLevel = "symbol_table"
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

allprojects {
    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // Dépôt privé requis pour résoudre la dépendance transitive du SDK Cardinal.
        // Les identifiants proviennent de local.properties / variables d'environnement
        // (JFROG_USER, JFROG_PASSWORD) — jamais en dur dans le code versionné.
        maven {
            url "https://cardinalcommerceprod.jfrog.io/artifactory/android"
            credentials {
                username jfrogUser
                password jfrogPassword
            }
        }
    }
}

dependencies {

    /* Implémentation Room */

    implementation "androidx.room:room-runtime:2.6.1"
    implementation("com.jakewharton.timber:timber:5.0.1")
    implementation "androidx.room:room-ktx:2.6.1"
    ksp("androidx.room:room-compiler:2.6.1")
    testImplementation "androidx.room:room-testing:2.6.0"
    implementation("androidx.security:security-crypto:1.1.0-alpha06")

    /* Chiffrement au repos de la base Room (RGPD - données médicales locales) */
    implementation "net.zetetic:sqlcipher-android:4.6.1"
    implementation "androidx.sqlite:sqlite:2.4.0"

    /* Injection de dépendances (Hilt) */
    implementation "com.google.dagger:hilt-android:2.52"
    ksp "com.google.dagger:hilt-compiler:2.52"

    implementation "androidx.fragment:fragment-ktx:1.8.5"
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.5'

    /* Implémentation exo-player */
    implementation 'androidx.media3:media3-exoplayer:1.2.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.2.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.0'
    implementation 'androidx.media3:media3-ui:1.2.0'

    /*Implémentation Calendrier*/
    implementation 'com.kizitonwose.calendar:view:2.9.0'

    // Nécessaire pour la gestion des dates LocalDate/YearMonth
    implementation("org.jetbrains.kotlinx:kotlinx-datetime:0.6.1")

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    implementation 'com.google.android.play:app-update-ktx:2.1.0'
    implementation 'com.github.therealbush:translator:1.0.2'
    implementation 'com.paypal.android:paypal-native-payments:1.1.0'

    implementation 'com.paypal.android:card-payments:1.1.0'
    implementation 'com.paypal.android:payment-buttons:1.1.0'

    implementation 'com.google.android.material:material:1.10.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.android.volley:volley:1.2.1'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "org.jetbrains.kotlin:kotlin-test:2.1.0"

    /* Tests : coroutines + mocking */
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    testImplementation "io.mockk:mockk:1.13.12"
}